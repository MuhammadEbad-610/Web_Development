<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile Card</title>
    <!-- Importing Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Link External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card-container">
        <!-- Avatar Image -->
        <div class="avatar-box">
            <img src="https://via.placeholder.com/120" alt="Profile Picture" class="avatar">
        </div>

        <!-- Name & Bio -->
        <h1 class="name">Muhammad Ebad Abbas</h1>
        <p class="location">Karachi, Pakistan</p>
        <p class="bio">"Senior CS Student exploring Web Development & IT Engineering."</p>

        <!-- Social / Resource Links -->
        <div class="links-container">
            <a href="https://github.com" target="_blank" class="link-btn">GitHub</a>
            <a href="https://linkedin.com" target="_blank" class="link-btn">LinkedIn</a>
            <a href="#" class="link-btn">GitLab</a>
            <a href="#" class="link-btn">My Resume</a>
        </div>
    </main>

</body>
</html>
